spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 本地联调：写完 auth 登录后在本机验证；通过后再改云库地址
    url: jdbc:mysql://localhost:3306/hrms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 云服务器示例（切换时取消注释并注释上方 localhost）：
    # url: jdbc:mysql://39.101.67.167:3306/hrms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  data:
    redis:
      # 本地 Redis：登录黑名单 / 失败锁定等先用本机测
      host: localhost
      port: 6379
      # 云 Redis 示例：
      # host: 39.101.67.167
      # port: 6379
  flyway:
    enabled: true

  # ---------- RabbitMQ：Phase 后期启用（审批催办/薪资分片等）----------
  # 启用步骤：1) 取消下方注释  2) application.yml 去掉 RabbitAutoConfiguration exclude
  #  3) 确认已引入 spring-boot-starter-amqp（见 hrms-app/pom.xml 注释块）
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  #   username: guest
  #   password: guest
  # 云 RabbitMQ 示例：
  # rabbitmq:
  #   host: 39.101.67.167
  #   port: 5672
  #   username: hrms
  #   password: hrms123

hrms:
  cors:
    allowed-origins: http://localhost:8000,http://127.0.0.1:8000,http://39.101.67.167:8000

logging:
  level:
    com.company.hrms: debug
    root: info
