spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 默认本机；云联调请设环境变量或复制 application-dev-local.yml.example → application-dev-local.yml（已 gitignore）
    url: jdbc:mysql://${HRMS_DB_HOST:127.0.0.1}:3306/hrms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${HRMS_DB_USERNAME:root}
    password: ${HRMS_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${HRMS_REDIS_HOST:127.0.0.1}
      port: ${HRMS_REDIS_PORT:6379}
  flyway:
    enabled: true

  # ---------- RabbitMQ：Phase 后期启用（审批催办/薪资分片等）----------
  # 启用步骤：1) 取消下方注释  2) application.yml 去掉 RabbitAutoConfiguration exclude
  #  3) 确认已引入 spring-boot-starter-amqp（见 hrms-app/pom.xml 注释块）
  # rabbitmq:
  #   host: ${HRMS_MQ_HOST:127.0.0.1}
  #   port: 5672
  #   username: hrms
  #   password: ${HRMS_MQ_PASSWORD:}

hrms:
  cors:
    allowed-origins: http://localhost:8000,http://127.0.0.1:8000,http://39.101.67.167:8000
  jwt:
    secret: ${HRMS_JWT_SECRET:hrms-dev-secret-key-change-me-32bytes!!}
  internal:
    token: ${HRMS_INTERNAL_TOKEN:hrms-dev-internal-token-change-me}
  sms:
    # 生产务必 false；联调开发码勿用于生产
    dev-enabled: true
    dev-code: "123456"

logging:
  level:
    com.company.hrms: debug
    root: info
