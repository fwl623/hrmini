server:
  port: 8080

spring:
  application:
    name: hrms-app
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  # RabbitMQ 已启用（连接服务器 39.101.67.167:5672）
  # 如需回退：取消本 exclude 注释，再注释 application-dev.yml 中 rabbitmq 配置
  # autoconfigure:
  #   exclude:
  #     - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Redis：登录/鉴权已依赖 StringRedisTemplate，勿再排除 RedisAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha


# 给运维/自己看的健康检查接口，比如服务是否活着
management:
  endpoints:
    web:
      exposure:
        include: health,info

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.company.hrms.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 公共模块配置（生产务必用环境变量覆盖密钥）
#
# jwt.secret  —— 服务端签发/校验 Access Token 的 HMAC 密钥（系统密钥，不是用户密码）。
#               用户登录用的是自己的账号密码；登录成功后服务端用此 secret 签名 JWT。
# crypto.aes-key —— 身份证/银行卡等库内加密用的 AES-256 密钥（Base64，解码后 32 字节）。
#               与登录无关，防库泄露时敏感字段明文可见。
#
hrms:
  jwt:
    secret: ${HRMS_JWT_SECRET:hrms-dev-secret-key-change-me-32bytes!!}
    access-expire-seconds: 7200
  # 模块间内部接口密钥（请求头 X-Internal-Token）；生产务必用环境变量覆盖
  internal:
    token: ${HRMS_INTERNAL_TOKEN:hrms-dev-internal-token-change-me}
  # 入职确认默认走本地真实建档/建号；仅联调隔离时可设 true 用 Mock
  feign:
    mock-enabled: false
  # Day4：RabbitMQ 催办默认关闭（骨架 + OverdueCheckJob）；启用见 RabbitConfig 注释
  rabbitmq:
    enabled: false
  # 短信：联调开启开发码；生产设 hrms.sms.dev-enabled=false
  sms:
    dev-enabled: true
    dev-code: "123456"
  # Base64(UTF-8 "hrms-dev-aes-256-key-32bytes!!!!")；仅本地开发
  # 生产示例：export HRMS_AES_KEY=... 或 SPRING_APPLICATION_JSON 覆盖 hrms.crypto.aes-key
  crypto:
    aes-key: aHJtcy1kZXYtYWVzLTI1Ni1rZXktMzJieXRlcyEhISE=
  cors:
    allowed-origins: http://localhost:8000,http://127.0.0.1:8000
  # 本地上传目录（请假证明材料等）
  upload:
    dir: ./data/uploads
    max-size-bytes: 10485760
