openapi: 3.0.3
info:
  title: HRMS API
  version: 0.1.0
  description: Sprint 0 契约占位；组织架构见 §6.2，完整清单见系分附录 H。
servers:
  - url: http://localhost:8080/api/v1
  - url: http://39.101.67.167:8080/api/v1
paths:
  /departments/tree:
    get:
      tags: [Org]
      summary: 部门树（含人数、负责人）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
  /departments/{id}/headcount:
    get:
      tags: [Org]
      summary: 部门人数（本部门 + 含下属）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      responses:
        "200":
          description: 成功
  /departments/{id}/can-delete:
    get:
      tags: [Org]
      summary: 删除前校验
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      responses:
        "200":
          description: 成功
  /departments:
    post:
      tags: [Org]
      summary: 新增部门
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeptRequest"
      responses:
        "200":
          description: 成功，data.id
  /departments/{id}:
    get:
      tags: [Org]
      summary: 部门详情（树节点同构字段，无 children）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      responses:
        "200":
          description: 成功
    put:
      tags: [Org]
      summary: 编辑部门（可移动上级）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeptRequest"
      responses:
        "200":
          description: 成功
    delete:
      tags: [Org]
      summary: 删除部门（须无子部门、无归属员工、无职位）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      responses:
        "200":
          description: 成功
        "422":
          description: 30005 部门非空
  /departments/{id}/merge:
    put:
      tags: [Org]
      summary: 部门合并（自动转移员工与子部门；含已离职，避免源部门删除后悬空）
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DeptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetDepartmentId]
              properties:
                targetDepartmentId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: 成功
  /positions:
    get:
      tags: [Org]
      summary: 职位分页列表（activeCount=归属人数：试用/正式/待离职，不含已离职）
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: departmentId
          in: query
          schema:
            type: integer
            format: int64
        - name: sequenceCode
          in: query
          schema:
            type: string
            enum: [M, P, S]
      responses:
        "200":
          description: 成功；list[].activeCount 为归属人数（含待离职 30）
    post:
      tags: [Org]
      summary: 新增职位
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "200":
          description: 成功，data.id
  /positions/{id}:
    get:
      tags: [Org]
      summary: 职位详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: 成功
    put:
      tags: [Org]
      summary: 编辑职位
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "200":
          description: 成功
    delete:
      tags: [Org]
      summary: 删除职位
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: 成功
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DeptId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PositionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    CreateDeptRequest:
      type: object
      required: [name, deptCode, sortOrder]
      properties:
        name:
          type: string
          maxLength: 64
        deptCode:
          type: string
          pattern: "^[A-Za-z0-9]{2}$"
        parentId:
          type: integer
          format: int64
          nullable: true
        headEmployeeId:
          type: integer
          format: int64
          nullable: true
        sortOrder:
          type: integer
        description:
          type: string
          maxLength: 256
    UpdateDeptRequest:
      allOf:
        - $ref: "#/components/schemas/CreateDeptRequest"
    CreatePositionRequest:
      type: object
      required:
        - name
        - sequenceCode
        - gradeMin
        - gradeMax
        - defaultProbationMonths
        - isStandard
      properties:
        name:
          type: string
        sequenceCode:
          type: string
          enum: [M, P, S]
        departmentId:
          type: integer
          format: int64
          nullable: true
        gradeMin:
          type: string
        gradeMax:
          type: string
        defaultProbationMonths:
          type: integer
        isStandard:
          type: boolean
        description:
          type: string
